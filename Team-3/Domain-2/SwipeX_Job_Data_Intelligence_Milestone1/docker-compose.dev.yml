services:
  job-swipe-service:
    build: .
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://swipex:swipex@postgres:5432/swipex
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swipex
      POSTGRES_USER: swipex
      POSTGRES_PASSWORD: swipex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swipex -d swipex"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
