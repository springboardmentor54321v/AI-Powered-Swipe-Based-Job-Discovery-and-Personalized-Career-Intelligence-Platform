# Single-host deployment profile. Populate these values from the host secret store.
name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}

x-log-policy: &log-policy
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *log-policy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *log-policy
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal]

  auth-service:
    profiles: [staging, production]
    image: ${AUTH_SERVICE_IMAGE:?Set AUTH_SERVICE_IMAGE to an immutable image tag}
    restart: unless-stopped
    logging: *log-policy
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      DATABASE_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS}
      JOB_SERVICE_URL: http://job-service:8000
      RESUME_SERVICE_URL: http://resume-service:8000
      MATCHING_ENGINE_URL: http://matching-engine:8000
      RESUME_STORAGE_PATH: /app/media/resumes
      HF_HOME: /cache/huggingface
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SENDER_EMAIL: ${SENDER_EMAIL:-noreply@swipex.app}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      job-service: { condition: service_started }
      resume-service: { condition: service_started }
      matching-engine: { condition: service_started }
    volumes:
      - resume-files:/app/media/resumes
      - ats-model-cache:/cache/huggingface
      - chroma-data:/Domain-3/Milestone3work/chroma_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health', headers={'X-Forwarded-Proto':'https'}), timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 120s
    networks: [internal]

  job-service:
    profiles: [staging, production]
    image: ${JOB_SERVICE_IMAGE:?Set JOB_SERVICE_IMAGE to an immutable image tag}
    restart: unless-stopped
    logging: *log-policy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [internal]

  schema-migrations:
    profiles: [staging, production]
    image: ${MIGRATIONS_IMAGE:?Set MIGRATIONS_IMAGE to an immutable image tag}
    restart: "no"
    logging: *log-policy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      job-service: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    networks: [internal]

  resume-service:
    profiles: [staging, production]
    image: ${RESUME_SERVICE_IMAGE:?Set RESUME_SERVICE_IMAGE to an immutable image tag}
    restart: unless-stopped
    logging: *log-policy
    environment:
      JOB_SERVICE_URL: http://job-service:8000
    depends_on:
      job-service: { condition: service_started }
    networks: [internal]

  matching-engine:
    profiles: [staging, production]
    image: ${MATCHING_SERVICE_IMAGE:?Set MATCHING_SERVICE_IMAGE to an immutable image tag}
    restart: unless-stopped
    logging: *log-policy
    environment:
      JOB_SERVICE_URL: http://job-service:8000
    depends_on:
      job-service: { condition: service_started }
    networks: [internal]

  gateway:
    profiles: [staging, production]
    image: ${GATEWAY_IMAGE:?Set GATEWAY_IMAGE to an immutable image tag}
    restart: unless-stopped
    logging: *log-policy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    depends_on:
      schema-migrations: { condition: service_completed_successfully }
      auth-service: { condition: service_healthy }
      job-service: { condition: service_healthy }
      resume-service: { condition: service_started }
      matching-engine: { condition: service_started }
    networks: [internal]

  frontend:
    profiles: [staging, production]
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to an immutable image tag}
    restart: unless-stopped
    logging: *log-policy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      gateway: { condition: service_started }
      schema-migrations: { condition: service_completed_successfully }
    networks: [internal]

volumes:
  postgres-data:
  redis-data:
  resume-files:
  ats-model-cache:
  chroma-data:

networks:
  internal:
    driver: bridge
