components:
  schemas:
    ATSScoreResponse:
      type: object
      description: |-
        Serializes the response from POST /api/v1/ats/score.
        Returns blended ATS score with keyword and semantic components.

        Formula (from Intern 4):
            final_ats_score = (0.40 × keyword_match_score) + (0.60 × semantic_similarity_score)
      properties:
        resume_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        job_id:
          type: string
        job_title:
          type: string
        keyword_score:
          type: number
          format: double
        semantic_similarity:
          type: number
          format: double
        semantic_score:
          type: number
          format: double
        final_ats_score:
          type: number
          format: double
        matched_skills:
          type: array
          items:
            type: string
        missing_skills:
          type: array
          items:
            type: string
        matched_keywords:
          type: array
          items:
            type: string
        missing_keywords:
          type: array
          items:
            type: string
        below_threshold:
          type: boolean
        threshold:
          type: number
          format: double
        detail:
          type: string
      required:
      - below_threshold
      - final_ats_score
      - job_id
      - keyword_score
      - matched_keywords
      - matched_skills
      - missing_keywords
      - missing_skills
      - resume_id
      - semantic_score
      - semantic_similarity
      - threshold
      - version_id
    ActionEnum:
      enum:
      - apply
      - save
      - skip
      - right
      - left
      type: string
      description: |-
        * `apply` - apply
        * `save` - save
        * `skip` - skip
        * `right` - right
        * `left` - left
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        status:
          type: string
          maxLength: 50
        resume_score:
          type: number
          format: double
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        applicant:
          type: integer
      required:
      - applicant
      - created_at
      - job_id
      - updated_at
    ApplicationStatusEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        job_id:
          type: string
          format: uuid
        from_status:
          type: string
          nullable: true
          maxLength: 50
        to_status:
          type: string
          maxLength: 50
        actor_id:
          type: string
          format: uuid
          nullable: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        metadata: {}
        application:
          type: string
          format: uuid
        applicant:
          type: integer
      required:
      - applicant
      - application
      - id
      - job_id
      - occurred_at
      - to_status
    CurrentUser:
      type: object
      description: |-
        Serializer for GET /api/v1/auth/me
        Returns current user identity and role.
      properties:
        user_id:
          type: string
          readOnly: true
        name:
          type: string
          description: Full name of user
          maxLength: 255
        role:
          type: string
          readOnly: true
      required:
      - name
      - role
      - user_id
    ExtractedSkill:
      type: object
      description: |-
        Serializes a skill extracted from a resume version.
        Maps to Intern 3's resume_skills table.
      properties:
        skill_name:
          type: string
          readOnly: true
        normalized_name:
          type: string
          readOnly: true
        source:
          type: string
          description: Extraction source (parsed, manual, nlp_ner)
          maxLength: 50
        confidence:
          type: number
          format: double
          nullable: true
          description: Extraction confidence score (0.0 - 1.0 or percentage)
      required:
      - normalized_name
      - skill_name
    GoogleOAuthResponse:
      type: object
      description: Response serializer for GET /api/v1/auth/oauth/google when unconfigured
      properties:
        message:
          type: string
        status:
          type: string
        detail:
          type: string
        configured_redirect_uri:
          type: string
        target_provider:
          type: string
      required:
      - configured_redirect_uri
      - detail
      - message
      - status
      - target_provider
    JobCreate:
      type: object
      description: Validates job requisition creation payload submitted by Recruiters.
      properties:
        title:
          type: string
          description: Position title (e.g. Senior Backend Engineer)
          maxLength: 255
        company:
          type: string
          default: Independent Recruiter
          maxLength: 255
        company_id:
          type: integer
          default: 1
        company_type:
          type: string
          default: Startup
        location:
          type: string
          default: Remote
        is_remote:
          type: boolean
          default: false
        remote:
          type: boolean
          default: false
        salary_min:
          type: integer
          minimum: 0
          default: 500000
        salary_max:
          type: integer
          minimum: 0
          default: 1000000
        skills:
          type: array
          items:
            type: string
        description:
          type: string
          default: Exciting career opportunity.
        job_type:
          type: string
          default: Full-time
        experience_level:
          type: string
          default: Mid-Level
        industry:
          type: string
          default: Technology
      required:
      - title
    JobUpdate:
      type: object
      description: Validates job posting update payload submitted by Recruiters.
      properties:
        title:
          type: string
          maxLength: 255
        company:
          type: string
          maxLength: 255
        location:
          type: string
        is_remote:
          type: boolean
        remote:
          type: boolean
        salary_min:
          type: integer
          minimum: 0
        salary_max:
          type: integer
          minimum: 0
        skills:
          type: array
          items:
            type: string
        description:
          type: string
        job_type:
          type: string
        experience_level:
          type: string
    Login:
      type: object
      description: |-
        Serializer for POST /api/v1/auth/login
        Authenticates email and password, returning JWT access & refresh tokens.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    LoginResponse:
      type: object
      description: Response serializer for POST /api/v1/auth/login
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: JWT refresh token
        role:
          type: string
          description: User role (e.g. job_seeker, recruiter, admin)
      required:
      - access_token
      - refresh_token
      - role
    MessageResponse:
      type: object
      description: Generic status/message response serializer for protected role endpoints
      properties:
        status:
          type: string
          description: Status indicator (e.g. success)
        message:
          type: string
          description: Informational message
        user_id:
          type: string
          description: User ID
        role:
          type: string
          description: User role
      required:
      - message
      - status
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          maxLength: 50
        title:
          type: string
          maxLength: 180
        body:
          type: string
          maxLength: 4000
        payload: {}
        read_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        user:
          type: integer
      required:
      - body
      - created_at
      - title
      - type
      - user
    PatchedApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        status:
          type: string
          maxLength: 50
        resume_score:
          type: number
          format: double
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        applicant:
          type: integer
    RecommendationItem:
      type: object
      description: |-
        Serializes a single job recommendation from Intern 4's
        UpgradedRecommendationEngine.
      properties:
        job_id:
          type: integer
        job_title:
          type: string
        company:
          type: string
        required_skills:
          type: array
          items:
            type: string
        semantic_similarity_score:
          type: number
          format: double
        swipe_boost:
          type: number
          format: double
        final_match_percentage:
          type: number
          format: double
        match_type:
          type: string
      required:
      - company
      - final_match_percentage
      - job_id
      - job_title
      - required_skills
      - semantic_similarity_score
      - swipe_boost
    RecommendationsResponse:
      type: object
      description: |-
        Serializes the response from GET /api/v1/recommendations/.
        Returns upgraded AI-powered job recommendations with semantic
        similarity and swipe-history blending.
      properties:
        user_id:
          type: string
        resume_id:
          type: string
          format: uuid
          nullable: true
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationItem'
        count:
          type: integer
        match_type:
          type: string
        detail:
          type: string
      required:
      - count
      - match_type
      - recommendations
      - user_id
    RefreshToken:
      type: object
      description: |-
        Serializer for POST /api/v1/auth/refresh
        Validates refresh token and returns a newly minted access token.
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
    RefreshTokenResponse:
      type: object
      description: Response serializer for POST /api/v1/auth/refresh
      properties:
        access_token:
          type: string
          description: Newly minted JWT access token
      required:
      - access_token
    Register:
      type: object
      description: |-
        Serializer for POST /api/v1/auth/register
        Validates input, checks duplicate emails, enforces role constraints,
        hashes the password, and creates the user.
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 6
        role:
          type: string
          default: job_seeker
      required:
      - email
      - name
      - password
    RegisterResponse:
      type: object
      description: Response serializer for POST /api/v1/auth/register
      properties:
        user_id:
          type: string
          description: Unique identifier of newly registered user
      required:
      - user_id
    ResumeParseResponse:
      type: object
      description: |-
        Serializes the response from POST /api/v1/resumes/{id}/parse.
        Returns parsed_text, extracted_skills, and structured skill details.
      properties:
        resume_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        version_number:
          type: integer
        original_filename:
          type: string
        parsed_status:
          type: string
        parsed_text:
          type: string
        extracted_skills:
          type: array
          items:
            type: string
        parsed_skills:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            $ref: '#/components/schemas/ExtractedSkill'
        parsed_at:
          type: string
          format: date-time
        detail:
          type: string
      required:
      - extracted_skills
      - original_filename
      - parsed_at
      - parsed_skills
      - parsed_status
      - parsed_text
      - resume_id
      - version_id
      - version_number
    ResumeUploadResponse:
      type: object
      description: |-
        Serializes the upload response per the Day-1 contract's
        ResumeUploadResponse schema.
      properties:
        resume_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        version_number:
          type: integer
        original_filename:
          type: string
        content_type:
          type: string
        file_size_bytes:
          type: integer
        sha256_hash:
          type: string
        label:
          type: string
          nullable: true
        is_active:
          type: boolean
        uploaded_at:
          type: string
          format: date-time
        extraction_status:
          type: string
      required:
      - content_type
      - extraction_status
      - file_size_bytes
      - is_active
      - label
      - original_filename
      - resume_id
      - sha256_hash
      - uploaded_at
      - version_id
      - version_number
    SuggestionItem:
      type: object
      description: |-
        Serializes a single AI-generated resume optimization suggestion.
        Maps to the Day-1 contract's suggestion item schema.
      properties:
        category:
          type: string
        priority:
          type: string
        title:
          type: string
        detail:
          type: string
        related_skills:
          type: array
          items:
            type: string
          nullable: true
      required:
      - category
      - detail
      - priority
      - title
    SuggestionsResponse:
      type: object
      description: |-
        Serializes the response from POST /api/v1/suggestions/.
        Returns AI-generated resume optimization suggestions per the Day-1 contract.
        Supports both LLM-powered and free rule-based fallback modes.
      properties:
        resume_id:
          type: string
          format: uuid
        job_id:
          type: string
          nullable: true
        job_title:
          type: string
        source:
          type: string
        keyword_match_pct:
          type: number
          format: double
        matched_skills:
          type: array
          items:
            type: string
        missing_skills:
          type: array
          items:
            type: string
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/SuggestionItem'
        generated_at:
          type: string
          format: date-time
        detail:
          type: string
      required:
      - generated_at
      - keyword_match_pct
      - matched_skills
      - missing_skills
      - resume_id
      - source
      - suggestions
    SwipeAction:
      type: object
      description: Validates the swipe request body per the Milestone 2 API contract.
      properties:
        job_id:
          type: integer
          minimum: 1
          description: Target job ID to swipe on (e.g. 101)
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          description: |-
            Swipe action: apply, save, skip (or legacy: right, left)

            * `apply` - apply
            * `save` - save
            * `skip` - skip
            * `right` - right
            * `left` - left
      required:
      - action
      - job_id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
