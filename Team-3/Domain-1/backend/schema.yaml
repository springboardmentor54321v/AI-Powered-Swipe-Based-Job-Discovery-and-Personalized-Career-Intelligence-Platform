  /api/v1/applications/:
    get:
      operationId: api_v1_applications_list
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/applications/{id}/history:
    get:
      operationId: api_v1_applications_history_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusEvent'
          description: ''
  /api/v1/applications/{id}/status:
    patch:
      operationId: api_v1_applications_status_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApplication'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/ats/score:
    post:
      operationId: m3_ats_score
      description: 'Calculates a blended ATS compatibility score for a parsed resume
        against a job posting. Uses Intern 4''s scoring engine: final_ats_score =
        (keyword_score × 0.40) + (semantic_score × 0.60). Requires the resume to be
        parsed first (POST /resumes/{id}/parse). Protected: JOB_SEEKER role only.
        Ownership-enforced.'
      summary: Compute ATS Score — Resume vs Job (M3)
      tags:
      - ATS Scoring (M3)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resume_id:
                  type: string
                  format: uuid
                  description: UUID of the Resume or ResumeVersion
                job_id:
                  type: string
                  description: Job ID to score against (matches jobId in dataset)
              required:
              - resume_id
              - job_id
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ATSScoreResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/login:
    post:
      operationId: api_v1_auth_login_create
      description: Authenticates user credentials and returns access token, refresh
        token, and user role.
      summary: User Login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/me:
    get:
      operationId: api_v1_auth_me_retrieve
      description: Returns current authenticated user identity and role from JWT token.
      summary: Get Current User Profile
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/oauth/google:
    get:
      operationId: api_v1_auth_oauth_google_retrieve
      description: Initiates Google OAuth2 authorization flow. Redirects to Google
        or returns setup instructions if unconfigured.
      summary: Initiate Google OAuth2 Sign-In
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleOAuthResponse'
          description: ''
        '302':
          content:
            application/json:
              schema:
                type: string
          description: ''
  /api/v1/auth/oauth/google/callback:
    get:
      operationId: api_v1_auth_oauth_google_callback_retrieve
      description: Handles Google OAuth2 redirect callback with authorization code
        and exchanges it for tokens.
      summary: Google OAuth2 Callback
      parameters:
      - in: query
        name: code
        schema:
          type: string
        description: Authorization code returned by Google OAuth2
        required: true
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: api_v1_auth_refresh_create
      description: Obtains a newly minted access token using a valid refresh token.
      summary: Refresh Access Token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshToken'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/register:
    post:
      operationId: api_v1_auth_register_create
      description: Creates a new user account with hashed password and assigned role
        (job_seeker or recruiter).
      summary: Register User Account
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/test/admin-only:
    get:
      operationId: api_v1_auth_test_admin_only_retrieve
      description: Protected test endpoint accessible exclusively by ADMIN role.
      summary: Admin Role Verification
      tags:
      - RBAC Verification
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/test/job-seeker-only:
    get:
      operationId: api_v1_auth_test_job_seeker_only_retrieve
      description: Protected test endpoint accessible exclusively by JOB_SEEKER role.
      summary: Candidate Role Verification
      tags:
      - RBAC Verification
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
