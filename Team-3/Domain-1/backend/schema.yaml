                additionalProperties: {}
          description: ''
  /api/v1/companies/:
    get:
      operationId: list_companies
      description: Public directory endpoint. Retrieves list of employer companies,
        industry sectors, headquarters, and company metadata.
      summary: List Companies
      parameters:
      - in: query
        name: company_type
        schema:
          type: string
        description: Filter by organizational tier (e.g. Startup, Enterprise, MNC)
      - in: query
        name: industry
        schema:
          type: string
        description: Filter by industry sector (e.g. Software, Financial Services,
          Healthcare)
      - in: query
        name: page
        schema:
          type: integer
        description: 'Page number for pagination (default: 1)'
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Number of companies per page (default: 20, max: 100)'
      - in: query
        name: search
        schema:
          type: string
        description: Keyword search across company name
      tags:
      - Companies
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/companies/{company_id}:
    get:
      operationId: get_company_detail
      description: Public endpoint. Fetches detailed profile of a specific company
        including industry, headquarters, and active jobs count.
      summary: Get Company Details by ID
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
        description: Unique identifier of the company (e.g. 1)
        required: true
      tags:
      - Companies
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/jobs/:
    get:
      operationId: list_jobs
      description: Public endpoint. Fetches paginated job listings with optional multi-criteria
        filtering and freshness/competition fields from the downstream Job Service.
      summary: List Job Postings
      parameters:
      - in: query
        name: company_type
        schema:
          type: string
        description: Filter by company type (e.g. Startup, Enterprise, MNC)
      - in: query
        name: location
        schema:
          type: string
        description: Filter jobs by location substring (e.g. Hyderabad, Bengaluru)
      - in: query
        name: page
        schema:
          type: integer
        description: 'Page number for paginated results (default: 1)'
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Number of items per page (default: 20, max: 100)'
      - in: query
        name: remote
        schema:
          type: boolean
        description: Filter by remote status (true / false)
      - in: query
        name: salary_max
        schema:
          type: integer
        description: Maximum annual salary filter (in INR)
      - in: query
        name: salary_min
        schema:
          type: integer
        description: Minimum annual salary filter (in INR)
      - in: query
        name: skills
        schema:
          type: string
        description: Comma-separated skill keywords to match (e.g. Python,Django,React)
      - in: query
        name: type
        schema:
          type: string
        description: Employment type (e.g. Full-time, Internship, Contract)
      tags:
      - Jobs
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: create_job_posting
      description: Protected endpoint for RECRUITER and ADMIN roles. Creates a new
        job posting in the downstream Job Service.
      summary: Create Job Posting (Recruiter)
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/jobs/{job_id}:
    get:
      operationId: get_job_detail
      description: Public endpoint. Fetches comprehensive job details including description,
        company info, compensation, and freshness/competition fields from the downstream
        Job Service.
      summary: Get Job Details by ID
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
        description: Unique identifier of the job posting (e.g. 101)
        required: true
      tags:
      - Jobs
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    put:
      operationId: update_job_posting
      description: Protected endpoint for RECRUITER and ADMIN roles. Updates fields
        on an existing job posting in the downstream Job Service.
      summary: Update Job Posting (Recruiter)
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
        required: true
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: delete_job_posting
      description: Protected endpoint for RECRUITER and ADMIN roles. Deletes a job
        posting in the downstream Job Service.
      summary: Delete Job Posting (Recruiter)
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
        required: true
      tags:
      - Jobs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '204':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/jobs/{job_id}/applications:
    get:
      operationId: api_v1_jobs_applications_retrieve
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
        required: true
      tags:
      - Jobs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/jobs/{job_id}/competition:
    get:
      operationId: api_v1_jobs_competition_retrieve
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
        required: true
      tags:
      - Jobs
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/jobs/search:
    get:
      operationId: search_jobs
      description: 'Advanced search endpoint matching jobs across multiple dimensions:
        keyword search across title/description, location, experience level, salary
        brackets, and required skills.'
      summary: Search and Filter Jobs
      parameters:
      - in: query
        name: experience_level
        schema:
          type: string
        description: Required experience band (Fresher, Junior, Mid-Level, Senior,
          Lead)
      - in: query
        name: is_remote
        schema:
          type: boolean
        description: Filter for remote positions only
      - in: query
        name: job_type
        schema:
          type: string
        description: Employment contract type (Full-time, Part-time, Internship, Contract)
      - in: query
        name: keyword
        schema:
          type: string
        description: Free-text search term matched against job title and description
      - in: query
        name: location
        schema:
          type: string
        description: City, region, or location string
      - in: query
        name: page
        schema:
          type: integer
        description: 'Page number for paginated search results (default: 1)'
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Number of items returned per page (default: 20, max: 100)'
      - in: query
        name: salary_max
        schema:
          type: integer
        description: Maximum annual compensation
      - in: query
        name: salary_min
        schema:
          type: integer
        description: Minimum annual compensation
      - in: query
        name: skills
        schema:
          type: string
        description: Comma-separated required skill tokens
      tags:
      - Jobs
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/matching/:
    get:
      operationId: get_matching_recommendations
      description: Gateway endpoint connecting to Intern 4's Domain-3 Matching Engine.
        Returns ranked job recommendations with heuristic match percentages.
      summary: Run Matching Engine
      parameters:
      - in: query
        name: resume_id
        schema:
          type: string
        description: Uploaded Resume UUID to generate heuristic or AI matching scores
          for
      - in: query
        name: user_id
        schema:
          type: string
        description: Candidate User ID
      tags:
      - Matching Engine
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/notifications/:
    get:
      operationId: api_v1_notifications_list
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/notifications/{id}/read:
    patch:
      operationId: api_v1_notifications_read_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/notifications/preferences:
    get:
      operationId: api_v1_notifications_preferences_retrieve
      tags:
      - api
