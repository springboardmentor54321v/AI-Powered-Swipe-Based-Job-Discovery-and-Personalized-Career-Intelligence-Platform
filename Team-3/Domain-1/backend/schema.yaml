openapi: 3.0.3
info:
  title: SwipeX Backend API
  version: 3.0.0
  description: |-
    SwipeX: Swipe-Based Intelligent Job Discovery and Career Assistance Platform.
    Milestone 1 — Authentication, Identity & RBAC API.
    Milestone 2 — Authentication, RBAC, Jobs, Search, Companies, Swipe, Recruiter CRUD, Matching Engine & Resume/ATS Gateway.
    Milestone 3 — Resume Upload, Versioning, ATS Scoring & AI Suggestions.
paths:
  /api/v1/alert-preferences/:
    get:
      operationId: api_v1_alert_preferences_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    put:
      operationId: api_v1_alert_preferences_update
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analytics/admin/hiring-trends:
    get:
      operationId: api_v1_analytics_admin_hiring_trends_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/analytics/recruiter/job-funnel:
