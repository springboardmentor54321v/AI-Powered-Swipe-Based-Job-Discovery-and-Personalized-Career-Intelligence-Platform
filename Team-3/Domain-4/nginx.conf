server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router handles application routes such as /login and /register.
    # Static asset files still resolve normally; unknown routes fall back to React.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy. The React app calls /api/v1 on port 5173, while
    # Nginx forwards those calls to the shared API gateway inside Docker.
    # This avoids browser CORS issues entirely in local development.
    location /api/ {
        proxy_pass http://gateway:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
