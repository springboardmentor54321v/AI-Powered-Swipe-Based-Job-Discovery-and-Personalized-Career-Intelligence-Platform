name: swipx-m1

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swipx}
      POSTGRES_USER: ${POSTGRES_USER:-swipx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./platform/database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  auth-service:
    build: ./Team-3/Domain-1/backend
    environment:
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,auth-service,gateway"
      DATABASE_NAME: ${POSTGRES_DB:-swipx}
      DATABASE_USER: ${POSTGRES_USER:-swipx}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  job-service:
    build: ./Team-3/Domain-2/SwipeX_Job_Data_Intelligence_Milestone1
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-swipx}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-swipx}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  resume-service:
    build: ./Team-3/Domain-3
    environment:
      JOB_SERVICE_URL: http://job-service:8000
    depends_on:
      - job-service

  gateway:
    image: nginx:1.27-alpine
    ports: ["${GATEWAY_PORT:-8080}:80"]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - job-service
      - resume-service

  frontend:
    build:
      context: ./Team-3/Domain-4
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_USE_AUTH_MOCK: "false"
        VITE_USE_JOBS_MOCK: "false"
    ports: ["5173:80"]
    depends_on:
      - gateway

volumes:
  postgres-data:
