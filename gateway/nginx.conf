server {
    listen 80;
    server_name _;
    client_max_body_size 15m;

    add_header Access-Control-Allow-Origin "http://localhost:5173" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-User-Id" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = / { return 302 http://localhost:5173/; }
    location = /favicon.ico { return 204; }
    # Domain 1 is the API gateway. All API calls go through it so JWT
    # validation, RBAC and trusted identity-header injection are consistent.
    location /api/v1/auth/ { proxy_pass http://auth-service:8000; }
    # The browser client uses slashless base endpoints.  Django's included
    # routes use trailing slashes, so proxy these three exact paths to their
    # canonical form internally; this avoids a POST redirect/500.
    location = /api/v1/jobs { proxy_pass http://auth-service:8000/api/v1/jobs/; }
    location = /api/v1/companies { proxy_pass http://auth-service:8000/api/v1/companies/; }
    location = /api/v1/swipes { proxy_pass http://auth-service:8000/api/v1/swipes/; }
    location /api/v1/jobs { proxy_pass http://auth-service:8000; }
    location /api/v1/companies { proxy_pass http://auth-service:8000; }
    location /api/v1/swipes { proxy_pass http://auth-service:8000; }
    # Milestone 3 resume upload/list/parse routes use the plural `/resumes/`
    # prefix and must reach the Django auth/API service.
    location /api/v1/resumes/ { proxy_pass http://auth-service:8000; }
    location /api/v1/ats/ { proxy_pass http://auth-service:8000; }
    location /api/v1/suggestions/ { proxy_pass http://auth-service:8000; }
    location /api/v1/resume/ { proxy_pass http://auth-service:8000; }
    location = /api/v1/recommendations { proxy_pass http://auth-service:8000/api/v1/recommendations/; }
    location /api/v1/recommendations { proxy_pass http://auth-service:8000; }
    location /api/v1/matching/ { proxy_pass http://auth-service:8000; }
    location /health { proxy_pass http://auth-service:8000; }
}
