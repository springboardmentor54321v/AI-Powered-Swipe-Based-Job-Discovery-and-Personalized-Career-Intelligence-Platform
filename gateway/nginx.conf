server {
    listen 80;
    server_name _;
    client_max_body_size 15m;

    add_header Access-Control-Allow-Origin "http://localhost:5173" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-User-Id" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = / { return 302 http://localhost:5173/; }
    location = /favicon.ico { return 204; }
    location /api/v1/auth/ { proxy_pass http://auth-service:8000; }
    location /api/v1/jobs { proxy_pass http://job-service:8000; }
    location /api/v1/swipes { proxy_pass http://job-service:8000; }
    location /api/v1/resume/ { proxy_pass http://resume-service:8000; }
    location /api/v1/recommendations { proxy_pass http://resume-service:8000; }
    location /health { proxy_pass http://auth-service:8000; }
}
