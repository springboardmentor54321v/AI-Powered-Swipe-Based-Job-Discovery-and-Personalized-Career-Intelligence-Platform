name: Milestone 4 CI and deployment

on:
  push:
    branches: [Team-3]
  pull_request:
    branches: [Team-3]
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy after CI and image publishing
        type: choice
        options: [staging, production]
        required: true
        default: staging

permissions:
  contents: read

concurrency:
  group: swipex-m4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: M4 tests, frontend build, and deployment config
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: swipex_test
          POSTGRES_USER: swipex
          POSTGRES_PASSWORD: swipex-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swipex -d swipex_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Domain 5 test dependencies
        run: python -m pip install -r Team-3/Domain-5/requirements-test.txt
      - name: Run Domain 5 deterministic contracts
        run: python -m pytest Team-3/Domain-5/testing/automated -m "not integration" -q
      - name: Install Domain 1 backend dependencies
        run: python -m pip install -r Team-3/Domain-1/backend/requirements.txt
      - name: Check Django configuration
        working-directory: Team-3/Domain-1/backend
        env:
          DEBUG: "True"
          DATABASE_NAME: swipex_test
          DATABASE_USER: swipex
          DATABASE_PASSWORD: swipex-test-password
          DATABASE_HOST: 127.0.0.1
          REDIS_HOST: 127.0.0.1
        run: python manage.py check
      - name: Create Domain 1 PostgreSQL schema
        working-directory: Team-3/Domain-1/backend
        env:
          DEBUG: "True"
          DATABASE_NAME: swipex_test
          DATABASE_USER: swipex
          DATABASE_PASSWORD: swipex-test-password
          DATABASE_HOST: 127.0.0.1
          REDIS_HOST: 127.0.0.1
        run: python manage.py migrate --noinput
      - name: Rehearse M4 SQL migrations on disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://swipex:swipex-test-password@127.0.0.1:5432/swipex_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f Team-3/Domain-5/testing/fixtures/m4-postgres-base-schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f Team-3/Domain-2/data-layer/migrations/001_core_features.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f Team-3/Domain-2/data-layer/migrations/002_competition_counter.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f Team-3/Domain-2/data-layer/migrations/003_analytics.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f Team-3/Domain-2/data-layer/tests/competition.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f Team-3/Domain-2/data-layer/sql/refresh_analytics.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f Team-3/Domain-2/data-layer/sql/integrity_checks.sql
      - name: Install Domain 2 test dependencies
        run: python -m pip install -r Team-3/Domain-2/SwipeX_Job_Data_Intelligence_Milestone1/requirements-dev.txt
      - name: Run Domain 2 service and seed-data tests
        working-directory: Team-3/Domain-2/SwipeX_Job_Data_Intelligence_Milestone1
        run: python -m pytest tests -q
      - name: Run Domain 3 M4 AI unit suite
        working-directory: Team-3/Domain-3/Milestone4work
        run: python -m unittest test_m4_suite.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Team-3/Domain-4/package-lock.json
      - name: Build production frontend
        working-directory: Team-3/Domain-4
        run: npm ci && npm run build
      - name: Validate deployment Compose configuration
        env:
          COMPOSE_PROJECT_NAME: swipex-validation
          POSTGRES_DB: swipex
          POSTGRES_USER: validate
          POSTGRES_PASSWORD: validation-only
          REDIS_PASSWORD: validation-only
          SECRET_KEY: validation-only
          JWT_SECRET_KEY: validation-only
          ALLOWED_HOSTS: example.invalid
          CORS_ALLOWED_ORIGINS: https://example.invalid
          CSRF_TRUSTED_ORIGINS: https://example.invalid
          AUTH_SERVICE_IMAGE: ghcr.io/example/auth:test
          JOB_SERVICE_IMAGE: ghcr.io/example/jobs:test
          RESUME_SERVICE_IMAGE: ghcr.io/example/resume:test
          MATCHING_SERVICE_IMAGE: ghcr.io/example/matching:test
          FRONTEND_IMAGE: ghcr.io/example/frontend:test
          GATEWAY_IMAGE: ghcr.io/example/gateway:test
          MIGRATIONS_IMAGE: ghcr.io/example/migrations:test
        run: docker compose -f Team-3/Domain-5/docker-compose.deploy.yml --profile staging config -q

  images:
    name: Build and publish immutable service images
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Set image namespace
        id: image
        shell: bash
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Team-3/Domain-5/deploy/auth.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/swipex-auth:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: Team-3/Domain-2/SwipeX_Job_Data_Intelligence_Milestone1
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/swipex-jobs:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: Team-3/Domain-3
          file: Team-3/Domain-3/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/swipex-resume:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: Team-3/Domain-3
          file: Team-3/Domain-3/Dockerfile.matching
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/swipex-matching:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Team-3/Domain-5/deploy/frontend.Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_USE_AUTH_MOCK=false
            VITE_USE_JOBS_MOCK=false
          tags: ghcr.io/${{ steps.image.outputs.owner }}/swipex-frontend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Team-3/Domain-5/deploy/gateway.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/swipex-gateway:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Team-3/Domain-5/deploy/migrations.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/swipex-migrations:${{ github.sha }}

  deploy:
    name: Deploy to ${{ inputs.environment }}
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.environment == 'staging' || (inputs.environment == 'production' && github.ref == 'refs/heads/main'))
    needs: [quality, images]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Require environment deployment configuration
        env:
          DEPLOY_HOOK: ${{ secrets.SWIPEX_DEPLOY_HOOK }}
          HEALTH_URL: ${{ vars.SWIPEX_HEALTH_URL }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo 'Configure SWIPEX_DEPLOY_HOOK in this GitHub Environment'; exit 1; }
          test -n "$HEALTH_URL" || { echo 'Configure SWIPEX_HEALTH_URL in this GitHub Environment'; exit 1; }
          case "$HEALTH_URL" in https://*) ;; *) echo 'SWIPEX_HEALTH_URL must use HTTPS'; exit 1;; esac
      - name: Trigger provider deployment
        env:
          DEPLOY_HOOK: ${{ secrets.SWIPEX_DEPLOY_HOOK }}
          IMAGE_TAG: ${{ github.sha }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: >-
          curl --fail --silent --show-error --retry 3 -X POST "$DEPLOY_HOOK"
          -H 'Content-Type: application/json'
          -d "{\"image_tag\":\"$IMAGE_TAG\",\"environment\":\"$TARGET_ENVIRONMENT\",\"commit\":\"$GITHUB_SHA\"}"
      - name: Verify deployed gateway health
        env:
          HEALTH_URL: ${{ vars.SWIPEX_HEALTH_URL }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$HEALTH_URL"; then exit 0; fi
            sleep 10
          done
          echo 'Health check failed. Use the provider rollback procedure to restore the previous release.'
          exit 1
